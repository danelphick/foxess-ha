type: markdown
content: |-
  {%- set fe = integration_entities('foxess') %}
  {%- set enabled_e = fe | select('search', 'scheduler') | reject('search', 'slot') | list | first %}
  {%- set slot_es = fe | select('search', 'scheduler_slot') | sort | list %}
  ## FoxESS Scheduler
  **Status:** {{ states(enabled_e) | title if enabled_e else 'unavailable' }}

  | # | Mode | Start | End | Min SoC | FD SoC | FD Power |
  |:---:|:------|:---:|:---:|:---:|:---:|:---:|
  {%- for s in slot_es %}
  {%- set mode = states(s) %}
  {%- if mode not in ['unknown', 'unavailable'] %}
  {%- set cur = now().strftime('%H:%M') %}
  {%- set start = state_attr(s, 'start') %}
  {%- set end = state_attr(s, 'end') %}
  {%- set active = mode not in ['disabled'] and start != none and end != none and start <= cur and cur < end %}
  | {{ '**' ~ loop.index ~ '**' if active else loop.index }} | {{ '**' ~ mode ~ '**' if active else ('~~disabled~~' if mode == 'disabled' else mode) }} | {{ start or '—' }} | {{ end or '—' }} | {{ state_attr(s, 'min_soc_on_grid') or '—' }}% | {{ state_attr(s, 'fd_soc') or '—' }}% | {{ state_attr(s, 'fd_pwr_w') or '—' }}W |
  {%- endif %}
  {%- endfor %}
